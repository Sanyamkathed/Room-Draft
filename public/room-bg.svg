<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="lamp" cx="62%" cy="30%" r="45%">
      <stop offset="0" stop-color="#d8ff3c" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#7c4dff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="18%" cy="85%" r="40%">
      <stop offset="0" stop-color="#ff9a4d" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d8ff3c" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0a0a0c"/>
  <rect width="1600" height="900" fill="url(#lamp)"/>
  <rect width="1600" height="900" fill="url(#warm)"/>
  <g fill="none" stroke="url(#wire)" stroke-width="1.2">
    <!-- back wall, side walls, floor, ceiling edges -->
    <path d="M520 250H1080V610H520Z"/>
    <path d="M0 40L520 250M1600 40L1080 250M0 880L520 610M1600 880L1080 610"/>
    <!-- floor grid -->
    <g stroke-opacity=".55">
      <path d="M520 610L330 900M640 610L560 900M760 610L740 900M880 610L920 900M1000 610L1100 900M1080 610L1290 900"/>
      <path d="M470 680H1130M410 760H1190M330 860H1270"/>
    </g>
    <!-- window -->
    <path d="M640 310H800V450H640ZM720 310V450M640 380H800" stroke-opacity=".8"/>
    <!-- shelf on wall + lamp on table -->
    <path d="M880 400H1020M880 400V408H1020V400" stroke-opacity=".9"/>
    <path d="M850 540H1050V556H850Z M870 556V610M1030 556V610" stroke-opacity=".9"/>
    <path d="M945 540V500M925 500H965L957 465H933Z" stroke="#d8ff3c" stroke-opacity=".5"/>
    <!-- pendant -->
    <path d="M800 250V215" stroke-opacity=".6"/>
  </g>
  <circle cx="950" cy="480" r="46" fill="#d8ff3c" opacity=".08"/>
  <rect y="450" width="1600" height="450" fill="url(#fade)"/>
</svg>
